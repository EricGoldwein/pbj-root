{# Intentional preview end — no content below this boundary #}
<div class="pbj-preview-viewport-end" id="pbjPreviewViewportEnd" role="region" aria-label="Preview access boundary">
    <div class="pbj-preview-viewport-fade" aria-hidden="true"></div>
    <div class="pbj-preview-access-panel">
        <p class="pbj-preview-access-copy mb-2">
            This is a preview of the <strong>{{ facility.display_name }}</strong> dashboard. Request access to review staffing trends, benchmarks, and facility records.
        </p>
        <a href="{{ cta_href }}" class="btn btn-primary btn-sm"{% if not cta_new_tab %} rel="nofollow"{% else %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ cta_label }}</a>
        {% if facility.provider_page_url %}
        <p class="small text-muted mb-0 mt-2"><a href="{{ facility.provider_page_url }}" class="link-secondary" rel="noopener">Public provider page</a></p>
        {% endif %}
    </div>
</div>
