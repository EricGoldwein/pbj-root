{# Static census context strip — mirrors census_context_strip.html (profile variant) #}
<div class="pbj-census-context-strip pbj-census-context-strip--profile" aria-label="Census summary for selected period">
    <dl class="pbj-census-context-stats mb-0">
        <div class="pbj-census-context-stat pbj-census-context-stat--avg">
            <dt>Avg census</dt>
            <dd class="pbj-census-context-avg-cell">
                <span class="pbj-preview-mask-bar pbj-preview-mask-bar--md" aria-hidden="true"></span>
            </dd>
        </div>
        <div class="pbj-census-context-stat">
            <dt>Occupancy</dt>
            <dd><span class="pbj-preview-mask-bar pbj-preview-mask-bar--sm" aria-hidden="true"></span></dd>
        </div>
    </dl>
</div>
